name: Test Internet

on:
  push:
    paths: ["test-internet/**", ".github/workflows/test-internet.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: test-internet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: test-internet/go.mod
      - run: go vet ./... && GOOS=windows go vet ./...
      - run: go test ./...
      - name: Compiler TestInternet.exe
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o TestInternet.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: TestInternet
          path: test-internet/TestInternet.exe
      - name: Publier dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-internet --cleanup-tag --yes || true
          gh release create test-internet TestInternet.exe \
            --target "$GITHUB_SHA" --latest \
            --title "Test Internet" \
            --notes "Téléchargez **TestInternet.exe** ci-dessous, puis double-cliquez dessus. Si Windows affiche « Windows a protégé votre ordinateur » : *Informations complémentaires* → *Exécuter quand même*. (Version compilée depuis ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}.)"
